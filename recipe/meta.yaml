{% set version = "1.2-6" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-formula
  version: "{{ version|replace("-", "_") }}"

source:
  url:
    - {{ cran_mirror }}/src/contrib/Formula_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/Formula/Formula_{{ version }}.tar.gz
  sha256: 7e611ac371c045e100a6205d92fe5104001942673798f970290fea12e33bfd37

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]
  host:
    - r-base
  run:
    - r-base

test:
  commands:
    - $R -e "library('Formula')"           # [not win]
    - "\"%R%\" -e \"library('Formula')\""  # [win]

about:
  home: https://zeileis.codeberg.page/Formula/
  license: GPL-2.0-or-later
  summary: Infrastructure for extended formulas with multiple parts on the right-hand side and/or multiple responses on the left-hand side (see <DOI:10.18637/jss.v034.i01>).
  license_family: GPL3
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3

extra:
  recipe-maintainers:
    - conda-forge/r
